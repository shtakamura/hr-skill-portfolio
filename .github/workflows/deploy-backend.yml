name: Deploy Backend (CDK)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "infra/cdk/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK dependencies
        working-directory: infra/cdk
        run: npm ci

      - name: Build CDK
        working-directory: infra/cdk
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/HrSkillPortfolioGitHubActionsDeployRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CDK stack
        working-directory: infra/cdk
        run: npx cdk deploy HrSkillPortfolioStack --require-approval never
